name: Bug
description: Something in a skill is wrong or invents an API
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: skill
    attributes:
      label: Skill
      description: Skill folder name, if known (for example blazium-cli).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Autowork, blazium-cli --json, or docs.blazium.app page.
